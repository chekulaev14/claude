<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>География клиентов - ТК Динамика</title>
    <meta name="description" content="География клиентов ТК Динамика. Интерактивная карта клиентов по всей России. ☎ 8-987-416-51-87">
    <meta name="keywords" content="клиенты, география, карта, грузоперевозки, транспортная компания">

    <!-- Open Graph -->
    <meta property="og:title" content="География клиентов - ТК Динамика">
    <meta property="og:description" content="География клиентов ТК Динамика. Интерактивная карта клиентов по всей России.">
    <meta property="og:type" content="website">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../assets/css/styles.css">

    <style>
        #map {
            height: 600px;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .map-stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            display: block;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .map-legend {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .legend-marker {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
        }

        .legend-marker.small {
            background-color: #10b981;
        }

        .legend-marker.medium {
            background-color: #3b82f6;
        }

        .legend-marker.large {
            background-color: #8b5cf6;
        }

        #loading {
            text-align: center;
            padding: 3rem;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body>
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main>
        <section class="services" id="clients-map">
            <div class="container">
                <h1 class="section-title">География наших клиентов</h1>
                <p class="section-subtitle">Интерактивная карта клиентов ТК Динамика по всей России</p>

                <!-- Статистика -->
                <div class="map-stats mb-4">
                    <div class="row">
                        <div class="col-md-4 stat-item">
                            <span class="stat-number" id="totalClients">-</span>
                            <span class="stat-label">Клиентов</span>
                        </div>
                        <div class="col-md-4 stat-item">
                            <span class="stat-number" id="totalCities">-</span>
                            <span class="stat-label">Городов</span>
                        </div>
                        <div class="col-md-4 stat-item">
                            <span class="stat-number" id="totalRegions">-</span>
                            <span class="stat-label">Регионов</span>
                        </div>
                    </div>
                </div>

                <!-- Легенда -->
                <div class="map-legend">
                    <h5 class="mb-3">Легенда карты</h5>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="legend-item">
                                <div class="legend-marker small">5</div>
                                <span>1-10 клиентов</span>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="legend-item">
                                <div class="legend-marker medium">25</div>
                                <span>11-50 клиентов</span>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="legend-item">
                                <div class="legend-marker large">75</div>
                                <span>50+ клиентов</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Карта -->
                <div id="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Загрузка карты...</span>
                    </div>
                    <p class="mt-3">Загрузка карты клиентов...</p>
                </div>

                <div id="map" style="display: none;"></div>

                <!-- Ссылки на другие страницы -->
                <div class="row mt-5">
                    <div class="col-md-6">
                        <a href="clients.html" class="btn btn-outline-primary btn-lg w-100">
                            📋 Список всех клиентов
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a href="portfolio.html" class="btn btn-outline-primary btn-lg w-100">
                            🚚 Наши проекты
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="../assets/js/template-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="../assets/js/script.js"></script>

    <!-- Google Maps API -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAeGxooF2L5rdIFszMLZBYhcVhT11u83MY&callback=initMap"></script>

    <!-- Clients Map Script -->
    <script src="../assets/js/clients-map.js"></script>
</body>
</html>

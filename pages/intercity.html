<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <meta name="description" content="Загрузка страницы...">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/images/favicon-new.png?v=4">
    <link rel="apple-touch-icon" href="/assets/images/favicon-new.png?v=4">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Main Content - будет заполнен динамически -->
    <main>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <div class="spinner-border text-danger" role="status">
                        <span class="visually-hidden">Загрузка...</span>
                    </div>
                    <p class="mt-3 text-muted">Загрузка содержимого страницы...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js" crossorigin="anonymous"></script>
    <!-- Template Engine -->
    <script src="../assets/js/template-engine.js"></script>
    <!-- Template Loader -->
    <script src="../assets/js/template-loader.js"></script>

    <script>
        // Загружаем страницу после полной загрузки DOM
        document.addEventListener('DOMContentLoaded', function() {
            // Рендерим страницу услуги "intercity"
            renderServicePage('intercity').then(() => {
                console.log('Страница межгород успешно загружена');
            }).catch(error => {
                console.error('Ошибка загрузки страницы:', error);
            });
        });
    </script>
</body>

</html>

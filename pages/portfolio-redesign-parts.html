<!-- ========================================
     OFFCANVAS FILTERS PANEL
     ======================================== -->

<!-- Offcanvas Filters Panel -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="filtersOffcanvas" aria-labelledby="filtersLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="filtersLabel">Фильтры</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Закрыть"></button>
    </div>
    <div class="offcanvas-body">
        <!-- Transport Type -->
        <div class="mb-4">
            <h6 class="fw-bold mb-3">Тип транспорта</h6>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="filter-truck" value="truck">
                <label class="form-check-label" for="filter-truck">Фура</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="filter-refrigerator" value="refrigerator">
                <label class="form-check-label" for="filter-refrigerator">Рефрижератор</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="filter-long-trailer" value="long-trailer">
                <label class="form-check-label" for="filter-long-trailer">Длинномер</label>
            </div>
        </div>

        <!-- Delivery Type -->
        <div class="mb-4">
            <h6 class="fw-bold mb-3">Тип перевозки</h6>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="filter-standard" value="standard">
                <label class="form-check-label" for="filter-standard">Стандартная</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="filter-temperature" value="temperature">
                <label class="form-check-label" for="filter-temperature">Температурный режим</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="filter-oversized" value="oversized">
                <label class="form-check-label" for="filter-oversized">Негабаритный груз</label>
            </div>
        </div>

        <!-- Distance Range -->
        <div class="mb-4">
            <h6 class="fw-bold mb-3">Расстояние</h6>
            <input type="range" class="form-range" min="0" max="2000" step="100" id="distanceRange" value="2000">
            <div class="d-flex justify-content-between small text-muted">
                <span>0 км</span>
                <span id="distanceValue">2000 км</span>
            </div>
        </div>

        <!-- Actions -->
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary flex-grow-1" id="resetFilters">Сбросить</button>
            <button type="button" class="btn btn-primary flex-grow-1" id="applyFilters">Применить</button>
        </div>
    </div>
</div>


<!-- ========================================
     ADDITIONAL CSS STYLES
     ======================================== -->

<style>
/* Delivery Cards Styling - Bootstrap 5 */

:root {
    --delivery-icon-size: 60px;
    --delivery-card-hover-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.15);
    --delivery-icon-bg: rgba(13, 110, 253, 0.1);
    --delivery-icon-bg-hover: rgba(13, 110, 253, 0.2);
}

/* Card Base Styles */
.delivery-card {
    transition: all 0.3s ease;
    cursor: pointer;
}

.delivery-card:hover,
.delivery-card:focus-visible {
    transform: translateY(-5px);
    box-shadow: var(--delivery-card-hover-shadow) !important;
}

.delivery-card:focus-visible {
    outline: 3px solid var(--bs-primary);
    outline-offset: 3px;
}

/* Colored Top Borders */
.delivery-card-standard {
    border-top: 4px solid var(--bs-primary) !important;
}

.delivery-card-temperature {
    border-top: 4px solid var(--bs-info) !important;
}

.delivery-card-oversized {
    border-top: 4px solid var(--bs-warning) !important;
}

/* Icon Container */
.delivery-icon {
    width: var(--delivery-icon-size);
    height: var(--delivery-icon-size);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.3s ease;
}

.delivery-card:hover .delivery-icon,
.delivery-card:focus-visible .delivery-icon {
    transform: scale(1.05);
}

.delivery-icon-primary { background-color: rgba(13, 110, 253, 0.1); }
.delivery-icon-info { background-color: rgba(13, 202, 240, 0.1); }
.delivery-icon-warning { background-color: rgba(255, 193, 7, 0.1); }

.delivery-card:hover .delivery-icon-primary { background-color: rgba(13, 110, 253, 0.2); }
.delivery-card:hover .delivery-icon-info { background-color: rgba(13, 202, 240, 0.2); }
.delivery-card:hover .delivery-icon-warning { background-color: rgba(255, 193, 7, 0.2); }

/* Details List */
.delivery-details dt {
    font-size: 0.875rem;
}

.delivery-details dd {
    font-size: 0.875rem;
}

/* List View Styles */
.delivery-card-list .card-body {
    display: flex !important;
    flex-direction: row;
    gap: 1rem;
}

.delivery-card-list .delivery-icon {
    width: 50px;
    height: 50px;
}

.delivery-card-list .card-title {
    font-size: 1rem;
}

/* Responsive Adjustments */
@media (max-width: 767.98px) {
    .delivery-icon {
        width: 50px;
        height: 50px;
    }

    .delivery-icon i {
        font-size: 1.5rem !important;
    }

    .delivery-details {
        font-size: 0.8125rem;
    }
}

/* Accessibility: Reduced Motion */
@media (prefers-reduced-motion: reduce) {
    .delivery-card,
    .delivery-icon {
        transition: none;
    }

    .delivery-card:hover,
    .delivery-card:focus-visible {
        transform: none;
    }
}
</style>


<!-- ========================================
     JAVASCRIPT FUNCTIONALITY
     ======================================== -->

<script>
// Delivery Filters & View Management
(function() {
    'use strict';

    // Initialize on DOM ready
    document.addEventListener('DOMContentLoaded', function() {
        initViewToggle();
        initFilters();
        initSearch();
        initSort();
        loadUserPreferences();
    });

    // Grid/List View Toggle
    function initViewToggle() {
        const buttons = document.querySelectorAll('[data-view]');
        const container = document.querySelector('#deliveryCards');

        if (!buttons.length || !container) return;

        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                const view = this.dataset.view;

                // Update aria-pressed
                buttons.forEach(b => b.setAttribute('aria-pressed', 'false'));
                this.setAttribute('aria-pressed', 'true');

                // Toggle classes
                buttons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                // Change layout
                if (view === 'list') {
                    container.classList.remove('row-cols-md-2', 'row-cols-lg-3');
                    container.querySelectorAll('.delivery-card').forEach(card => {
                        card.classList.add('delivery-card-list');
                    });
                } else {
                    container.classList.add('row-cols-md-2', 'row-cols-lg-3');
                    container.querySelectorAll('.delivery-card').forEach(card => {
                        card.classList.remove('delivery-card-list');
                    });
                }

                // Save preference
                localStorage.setItem('deliveryView', view);
            });
        });
    }

    // Distance Range Update
    const distanceRange = document.getElementById('distanceRange');
    const distanceValue = document.getElementById('distanceValue');

    if (distanceRange && distanceValue) {
        distanceRange.addEventListener('input', function() {
            distanceValue.textContent = this.value + ' км';
        });
    }

    // Apply Filters
    const applyBtn = document.getElementById('applyFilters');
    if (applyBtn) {
        applyBtn.addEventListener('click', function() {
            filterDeliveries();
            const offcanvas = document.getElementById('filtersOffcanvas');
            if (offcanvas) {
                const bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvas);
                if (bsOffcanvas) bsOffcanvas.hide();
            }
        });
    }

    // Reset Filters
    const resetBtn = document.getElementById('resetFilters');
    if (resetBtn) {
        resetBtn.addEventListener('click', function() {
            document.querySelectorAll('#filtersOffcanvas input[type="checkbox"]').forEach(cb => cb.checked = false);
            if (distanceRange) distanceRange.value = 2000;
            if (distanceValue) distanceValue.textContent = '2000 км';
            filterDeliveries();
        });
    }

    // Filter Logic
    function filterDeliveries() {
        const cards = document.querySelectorAll('.delivery-card-wrapper');
        let visibleCount = 0;

        // Get selected filters
        const selectedTypes = Array.from(document.querySelectorAll('#filtersOffcanvas input[type="checkbox"]:checked'))
            .map(cb => cb.value);
        const maxDistance = distanceRange ? parseInt(distanceRange.value) : 2000;

        cards.forEach(card => {
            const cardData = card.dataset;
            const distance = parseInt(cardData.distance);

            let show = true;

            // Filter by type
            if (selectedTypes.length > 0) {
                const hasMatch = selectedTypes.some(type =>
                    cardData.transportType === type || cardData.deliveryType === type
                );
                if (!hasMatch) show = false;
            }

            // Filter by distance
            if (distance > maxDistance) show = false;

            // Show/hide card
            card.style.display = show ? '' : 'none';
            if (show) visibleCount++;
        });

        // Update results count
        const resultsCount = document.getElementById('resultsCount');
        if (resultsCount) {
            resultsCount.innerHTML = `Показано <strong>${visibleCount}</strong> рейсов`;
        }
    }

    // Search
    function initSearch() {
        const searchInput = document.getElementById('deliverySearch');
        if (!searchInput) return;

        searchInput.addEventListener('input', debounce(function() {
            const query = this.value.toLowerCase();
            const cards = document.querySelectorAll('.delivery-card-wrapper');
            let visibleCount = 0;

            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                const show = text.includes(query);
                card.style.display = show ? '' : 'none';
                if (show) visibleCount++;
            });

            const resultsCount = document.getElementById('resultsCount');
            if (resultsCount) {
                resultsCount.innerHTML = `Показано <strong>${visibleCount}</strong> рейсов`;
            }
        }, 300));
    }

    // Sort
    function initSort() {
        document.querySelectorAll('[data-sort]').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const sortBy = this.dataset.sort;
                sortDeliveries(sortBy);
            });
        });
    }

    function sortDeliveries(by) {
        const container = document.querySelector('#deliveryCards');
        if (!container) return;

        const cards = Array.from(container.querySelectorAll('.delivery-card-wrapper'));

        cards.sort((a, b) => {
            if (by === 'date') {
                return new Date(b.dataset.date) - new Date(a.dataset.date);
            } else if (by === 'price') {
                return parseInt(a.dataset.price) - parseInt(b.dataset.price);
            } else if (by === 'distance') {
                return parseInt(a.dataset.distance) - parseInt(b.dataset.distance);
            }
            return 0;
        });

        cards.forEach(card => container.appendChild(card));
    }

    // Load saved preferences
    function loadUserPreferences() {
        const savedView = localStorage.getItem('deliveryView');
        if (savedView) {
            const btn = document.querySelector(`[data-view="${savedView}"]`);
            if (btn) btn.click();
        }
    }

    // Debounce helper
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

})();
</script>
